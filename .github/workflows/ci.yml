name: AstraRun CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test-windows:
    name: Windows Test Suite (Offline / Mock LLM)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Run Ruff Linting
        run: |
          ruff check src tests

      - name: Enforce Offline Invariant (Zero Remote Model Downloads)
        run: |
          # Block huggingface/ollama network egress during CI unit tests
          $env:HF_HUB_OFFLINE = "1"
          $env:TRANSFORMERS_OFFLINE = "1"
          $env:ASTRARUN_MOCK_MODELS = "1"
          echo "Offline environment variables set."

      - name: Run Unit & Governance Test Suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          ASTRARUN_MOCK_MODELS: "1"
        run: |
          pytest tests/ -v -m "not live and not benchmark" --cov=src/astrarun --cov-report=term-missing
