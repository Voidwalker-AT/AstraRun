[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrarun"
version = "1.0.0-rc.1"
description = "AstraRun - Windows Intelligent Command Launcher"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Astra Engineering Team" }
]
dependencies = [
    "PySide6>=6.8.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
laya = [
    "laya>=0.3.20",
]

[project.scripts]
astrarun = "astrarun.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
