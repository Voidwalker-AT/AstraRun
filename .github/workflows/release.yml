name: AstraRun Release Build & Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0-rc.1)'
        required: true
        default: 'v1.0.0-rc.1'

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows Release Package & Installer
    runs-on: windows-latest
    environment: production-release  # Requires manual approval gate
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pytest

      - name: Run Test Suite
        env:
          HF_HUB_OFFLINE: "1"
          ASTRARUN_MOCK_MODELS: "1"
        run: |
          pytest tests/ -v -m "not benchmark"

      - name: Build PyInstaller Standalone Executable
        run: |
          pyinstaller packaging/AstraRun.spec --noconfirm

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AstraRun.iss

      - name: Generate SPDX 2.3 SBOM
        run: |
          python scripts/generate_sbom.py --output dist/AstraRun-1.0.0-rc.1.spdx.json

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 dist\AstraRun-Setup-*.exe, dist\*.spdx.json | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Out-File -FilePath dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      - name: Upload Artifacts to Release Draft
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/AstraRun-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/AstraRun-1.0.0-rc.1.spdx.json
